<html>

<body>

<h2>Review Entities</h2>

<form action="/save" method="post">

<input
type="hidden"
name="count"
value="{{annotations|length}}">

<table border="1">

<tr>

<th>Sentence</th>

<th>Entity</th>

<th>Original</th>

<th>Correct</th>

<th>Start</th>

<th>End</th>

<th>IOB</th>

</tr>

{% for row in annotations %}

<tr>

<td>

{{row.sentence}}

<input
type="hidden"
name="sentence_{{loop.index0}}"
value="{{row.sentence}}">

</td>

<td>

{{row.entity}}

<input
type="hidden"
name="entity_{{loop.index0}}"
value="{{row.entity}}">

</td>

<td>

{{row.original_label}}

<input
type="hidden"
name="original_{{loop.index0}}"
value="{{row.original_label}}">

</td>

<td>

<select name="corrected_{{loop.index0}}">

{% for label in [
"PERSON",
"ORG",
"GPE",
"LOC",
"PRODUCT",
"DATE",
"TIME",
"MONEY",
"EVENT",
"LAW",
"WORK_OF_ART",
"NORP",
"FAC",
"LANGUAGE",
"QUANTITY",
"CARDINAL",
"ORDINAL",
"NONE"
] %}

<option
value="{{label}}"
{% if label==row.original_label %}selected{% endif %}>

{{label}}

</option>

{% endfor %}

</select>

</td>

<td>

{{row.start}}

<input
type="hidden"
name="start_{{loop.index0}}"
value="{{row.start}}">

</td>

<td>

{{row.end}}

<input
type="hidden"
name="end_{{loop.index0}}"
value="{{row.end}}">

</td>

<td>

{{row.iob}}

<input
type="hidden"
name="iob_{{loop.index0}}"
value="{{row.iob}}">

</td>

</tr>

{% endfor %}

</table>

<br>

<input type="submit" value="Save">

</form>

</body>

</html>
